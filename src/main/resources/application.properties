# ===== Application =====
spring.application.name=SafetyDesk
server.port=9090

# ===== MySQL Database Connection =====
spring.datasource.url=jdbc:mysql://localhost:3306/safetydesk?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Hibernate / JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Logging =====
logging.level.com.cts=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===== JWT  =====
safetydesk.jwt.secret=ChangeThisToALongRandomSecretOfAtLeast32BytesForHS256Signing!!

# Access token (short-lived)
 # 30 minutes
safetydesk.jwt.access-expiration-ms=1800000 
# Refresh token (longer-lived)
  # 24 hours (recommended)
safetydesk.jwt.refresh-expiration-ms=86400000

safetydesk.security.max-failed-attempts=5

safetydesk.seed.admin-email=admin@s.com
safetydesk.seed.admin-password=admin

springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs